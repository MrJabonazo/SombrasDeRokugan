<div class="layout-row">
    <mat-card [class.mat-elevation-z8]="true">
    <mat-card-header class="card-header">
      <mat-card-title>Inicio Sesión</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form action="">
        <mat-form-field class="example-full-width">
          <mat-label>Email</mat-label>
          <input type="email" matInput />
        </mat-form-field>
        <mat-form-field class="example-full-width">
          <mat-label>Clave</mat-label>
          <input type="password" matInput />
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button mat-fab class="full-width btn-init">
        Entrar
      </button>
    </mat-card-actions>
    <mat-divider class="mat-divider"></mat-divider>
    <mat-card-actions>
      <button mat-fab class="full-width btn-create">Crear Cuenta</button>
    </mat-card-actions>
  </mat-card>
